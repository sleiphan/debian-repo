name: Update Debian Repository

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read # required for ghcr.io

jobs:
  update:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/import-package:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: packages

      - name: Fix workspace permissions
        run: |
          chown -R $(id -u):$(id -g) .

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Download latest release from project
        run: |
          mkdir incoming

          # CTools
          curl -L -o incoming/ctools-dev.deb https://github.com/sleiphan/ctools/releases/latest/download/ctools-dev.deb
          curl -L -o incoming/ctools-runtime.deb https://github.com/sleiphan/ctools/releases/latest/download/ctools-runtime.deb
          
          # Session Provider
          curl -L -o incoming/blackhole-session-provider-dev.deb https://github.com/sleiphan/blackhole-session-provider/releases/latest/download/blackhole-session-provider-dev.deb
          curl -L -o incoming/blackhole-session-provider-runtime.deb https://github.com/sleiphan/blackhole-session-provider/releases/latest/download/blackhole-session-provider-runtime.deb

      - name: Include package in repo
        run: |
          reprepro includedeb stable incoming/*.deb
      
      - name: Remove files that should not be added to the repo.
        run: |
          rm -rf incoming

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update repo"
          git push
